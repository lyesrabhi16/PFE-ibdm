  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }
    .splash-content {
      text-align: center;
    }
  
   
    .splash-logo {
      width: 150px;
      height: 150px;
    }
    .text-content {
      font-size: 30px;
      font-weight: 20;
    }
    .loader {
      margin: auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .footer-image {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px; 
    opacity: 0.6; 
  }

  .footer-image img {
    width: 100%;
    height: auto;
  }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
  
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-content">

        <div class="loader"></div>

      </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Charger les paramètres depuis le localStorage
        const darkThemeMode = localStorage.getItem("darkThemeMode") === "true";
        const locale = localStorage.getItem("locale") || "en";
        const body = document.body;
        const splashscreen = document.getElementById("splash-screen");
        // uuse dark mode
        if (darkThemeMode) {
          splashscreen.style.background = "#121212"
          document.body.style.background = "#121212"
          document.body.style.color = "#ffffff";
        }
    
        // use fr language 
        // const textContent = document.querySelector(".text-content");
        // if (textCntent) {

        const text_language = document.getElementById("text-id");

        if (locale === '"fr"') {
          text_language.textContent = "Bienvenue dans votre application";
        }
        console.log(text_language.textContent);
        
        {{flutter_js}}
        {{flutter_build_config}}
        // Cacher le splash screen après le chargement de Flutter
        const splashScreen = document.getElementById("splash-screen");
    
        _flutter.loader.load({
          onEntrypointLoaded: async function (engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();
            await appRunner.runApp();
    
            // Masquer le splash screen après le chargement
            if (splashScreen) {
              splashScreen.style.display = "none";
            }
          }
        });
      });
    </script>
