services:
  mongos:
    container_name: mongos
    image: mongo
    command: mongos --configdb cfgrs/cfg-svr-1:27017,cfg-svr-2:27017,cfg-svr-3:27017 --port 27017 --bind_ip 0.0.0.0
    ports:
      - 30000:27017
    networks:
      - mongo-cluster

networks:
  mongo-cluster:
    driver: bridge
    name: mongo-cluster
