name: mongos

services:
  mongos:
    container_name: mongos
    image: mongo
    env_file:
      - .env
    entrypoint:
      - bash
      - -c
      - |
        echo "init mongos start"
        chmod 400 /etc/mongo/keyfile;
        chown 999:999 /etc/mongo/keyfile;
        mongos --keyFile /etc/mongo/keyfile  --configdb cfgrs/cfg-svr-1:27017,cfg-svr-2:27017,cfg-svr-3:27017 --port 27017 --bind_ip 0.0.0.0 &
        echo "mongos started";
        sleep 10;
        mongosh --eval 'load("/etc/mongo/scripts/init.js")';
        tail -f /dev/null
    ports:
      - 30000:27017
    healthcheck:
      test: "mongosh -u ${MONGO_ADMIN_USER} -p ${MONGO_ADMIN_PASS} --eval 'db.runCommand({ ping: 1 })'"
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 20s
    networks:
      - ibdm-mongo-cluster
    volumes:
      - ./files:/etc/mongo

  setup-mongos:
    container_name: setup-mongos
    image: mongo
    env_file:
      - .env
    entrypoint: 
         - bash
         - -c
         - |
            echo "start mongos sharding configuration";
            mongosh -u ${MONGO_ADMIN_USER} -p ${MONGO_ADMIN_PASS} --host mongos --eval "load('/etc/mongo/scripts/mongos_sharding_config.js')"
            echo "mongos sharding configuration completed";
    command: mongosh --eval 'sh.status()' mongos:27017
    volumes_from:
      - mongos
    depends_on:
       mongos:
         condition: service_healthy
    networks:
      - ibdm-mongo-cluster

networks:
  ibdm-mongo-cluster:
    driver: bridge
    name: ibdm-mongo-cluster

volumes:
  mongos: {}
