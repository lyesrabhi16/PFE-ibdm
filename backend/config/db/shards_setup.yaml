name: setup_shards

services:
  setup-site1-shards:
    container_name: setup-site1-shards
    image: mongo
    env_file: .env
    command: | 
        mongosh -u ${SITE1_LOCAL_ADMIN_USER} -p ${SITE1_LOCAL_ADMIN_PASS} --host site1rs/site1_shard_1 --eval 
         'rs.reconfig(
              {
                  _id: "site1rs",
                  members: [
                    { _id : 0, host : "site1_shard_1:27017" }, 
                    { _id : 1, host : "site1_shard_2:27017" }, 
                    { _id : 2, host : "site1_shard_3:27017" },
                    { _id : 3, host : "site1_shard_4:27017" },
                  ]
              }
          );'
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: "mongosh -u ${SITE1_LOCAL_ADMIN_USER} -p ${SITE1_LOCAL_ADMIN_PASS} --eval 'rs.status()' site1_shard_1:27017"
      interval: 10s
      timeout: 10s
      retries: 2
    
  setup-site2-shards:
    container_name: setup-site2-shards
    image: mongo
    command: | 
        mongosh -u ${SITE2_LOCAL_ADMIN_USER} -p ${SITE2_LOCAL_ADMIN_USER} --host site2_shard_1:27017 --eval 
         'rs.reconfig(
              {
                  _id: "site2rs",
                  members: [
                    { _id : 0, host : "site2_shard_1:27017" }, 
                    { _id : 1, host : "site2_shard_2:27017" }, 
                    { _id : 2, host : "site2_shard_3:27017" },
                    { _id : 3, host : "site2_shard_4:27017" },
                  ]
              }
          );'
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: "mongosh -u ${SITE2_LOCAL_ADMIN_USER} -p ${SITE2_LOCAL_ADMIN_PASS} --eval 'rs.status()' site2_shard_1:27017"
      interval: 10s 
      timeout: 10s
      retries: 2

  setup-site3-shards:
    container_name: setup-site3-shards
    image: mongo
    command: | 
        mongosh -u ${SITE3_LOCAL_ADMIN_USER} -p ${SITE3_LOCAL_ADMIN_PASS} --host site3_shard_1:27017 --eval 
         'rs.reconfig(
              {
                  _id: "site3rs",
                  members: [
                    { _id : 0, host : "site3_shard_1:27017" }, 
                    { _id : 1, host : "site3_shard_2:27017" }, 
                    { _id : 2, host : "site3_shard_3:27017" },
                    { _id : 3, host : "site3_shard_4:27017" },
                  ]
              }
          );'
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: "mongosh -u ${SITE3_LOCAL_ADMIN_USER} -p ${SITE3_LOCAL_ADMIN_PASS} --eval 'rs.status()' site3_shard_1:27017"
      interval: 10s
      timeout: 10s
      retries: 2

networks:
  ibdm-mongo-cluster:
    driver: bridge
    name: ibdm-mongo-cluster
