
services:
  site2_shard_1:
    container_name: site2_shard_1
    image: mongo
    command: mongod --shardsvr --replSet site2rs --port 27017 --dbpath /data/db
    ports:
      - 40201:27017
    volumes:
      - site2_shard_1:/data/db
    networks:
      - ibdm-mongo-cluster
      
  site2_shard_2:
    container_name: site2_shard_2
    image: mongo
    command: mongod --shardsvr --replSet site2rs --port 27017 --dbpath /data/db
    ports:
      - 40202:27017
    volumes:
      - site2_shard_2:/data/db
    networks:
      - ibdm-mongo-cluster
      
  site2_shard_3:
    container_name: site2_shard_3
    image: mongo
    command: mongod --shardsvr --replSet site2rs --port 27017 --dbpath /data/db
    ports:
      - 40203:27017
    volumes:
      - site2_shard_3:/data/db
    networks:
      - ibdm-mongo-cluster

volumes:
  site2_shard_1: {}
  site2_shard_2: {}
  site2_shard_3: {}

networks:
  ibdm-mongo-cluster:
    driver: bridge
    name: ibdm-mongo-cluster