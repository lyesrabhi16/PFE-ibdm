
services:
  site3_shard_1:
    container_name: site3_shard_1
    image: mongo
    command: mongod --shardsvr --replSet site3rs --port 27017 --dbpath /data/db
    ports:
      - 40301:27017
    volumes:
      - site3_shard_1:/data/db
    networks:
      - mongo-cluster
      
  site3_shard_2:
    container_name: site3_shard_2
    image: mongo
    command: mongod --shardsvr --replSet site3rs --port 27017 --dbpath /data/db
    ports:
      - 40302:27017
    volumes:
      - site3_shard_2:/data/db
    networks:
      - mongo-cluster
      
  site3_shard_3:
    container_name: site3_shard_3
    image: mongo
    command: mongod --shardsvr --replSet site3rs --port 27017 --dbpath /data/db
    ports:
      - 40303:27017
    volumes:
      - site3_shard_3:/data/db
    networks:
      - mongo-cluster

volumes:
  site3_shard_1: {}
  site3_shard_2: {}
  site3_shard_3: {}

networks:
  mongo-cluster:
    driver: bridge
    name: mongo-cluster