services:
  site1_shard_1:
    container_name: site1_shard_1
    image: mongo
    command: mongod --shardsvr --replSet site1rs --port 27017 --dbpath /data/db
    ports:
      - 40101:27017
    volumes:
      - site1_shard_1:/data/db
    networks:
      - mongo-cluster

  site1_shard_2:
    container_name: site1_shard_2
    image: mongo
    command: mongod --shardsvr --replSet site1rs --port 27017 --dbpath /data/db
    ports:
      - 40102:27017
    volumes:
      - site1_shard_2:/data/db
    networks:
      - mongo-cluster

  site1_shard_3:
    container_name: site1_shard_3
    image: mongo
    command: mongod --shardsvr --replSet site1rs --port 27017 --dbpath /data/db
    ports:
      - 40103:27017
    volumes:
      - site1_shard_3:/data/db
    networks:
      - mongo-cluster

volumes:
  site1_shard_1: {}
  site1_shard_2: {}
  site1_shard_3: {}

networks:
  mongo-cluster:
    driver: bridge
    name: mongo-cluster
