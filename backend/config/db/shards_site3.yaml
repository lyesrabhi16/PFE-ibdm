name: site3

services:
  site3_shard_1:
    container_name: site3_shard_1
    image: mongo
    env_file: .env
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /etc/mongo/keyfile
        chown 999:999 /etc/mongo/keyfile
        echo "SITE3: Starting mongod..."
        mongod --logpath /data/db/mongod.log --keyFile /etc/mongo/keyfile --shardsvr --replSet site3rs --bind_ip 0.0.0.0 --port 27017 --dbpath /data/db &
        echo "SITE3: Waiting for mongod to start...30 seconds"
        sleep 30
        echo "SITE3: initiating replicaSet..."
        mongosh --eval "rs.initiate(
              {
                _id:'site3rs',
                members:[
                  {_id: 0, host:'site3_shard_1', priority: 2},
                  {_id: 1, host:'site3_shard_2', priority: 1},
                  {_id: 2, host:'site3_shard_3', priority: 1}
                ]
              }
        )"
        echo "SITE3: Waiting for rs.initiate to complete...10 seconds"
        sleep 10
        echo "SITE3: rs.initiate completed"
        echo "SITE3: Creating local admin user..."
        echo '
            rs.status()
            use admin
            db.createUser(
              {
                  user: "${SITE3_LOCAL_ADMIN_USER}",
                  pwd: "${SITE3_LOCAL_ADMIN_PASS}",
                  roles: [
                      {
                          role: "root",
                          db: "admin"
                      },
                      {
                          role: "clusterAdmin",
                          db: "admin"
                      },
                      {
                          role: "readAnyDatabase",
                          db: "admin"
                      },
                      {
                          role: "readWriteAnyDatabase",
                          db: "admin"
                      },
                      {
                          role: "userAdminAnyDatabase",
                          db: "admin"
                      }
                  ]
              }
            )
            exit
        ' > /tmp/create_local_admin.js
        mongosh < /tmp/create_local_admin.js
        sleep 5
        mongosh < /tmp/create_local_admin.js
            
        echo "SITE3: tail mongod.log"
        tail -f /data/db/mongod.log
    ports:
      - 40301:27017
    volumes:
      - site3_shard_1:/data/db
      - ./files:/etc/mongo
    networks:
      - ibdm-mongo-cluster
    depends_on:
      site3_shard_2:
        condition: service_healthy
      site3_shard_3:
        condition: service_healthy
    healthcheck:
      test: "mongosh -u ${SITE3_LOCAL_ADMIN_USER} -p ${SITE3_LOCAL_ADMIN_PASS} --eval 'rs.status()' site3_shard_1:27017"
      interval: 10s
      timeout: 10s
      retries: 2
    restart: on-failure:3
      
  site3_shard_2:
    container_name: site3_shard_2
    image: mongo
    env_file: .env
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /etc/mongo/keyfile
        chown 999:999 /etc/mongo/keyfile
        exec docker-entrypoint.sh $$@
    command: mongod --keyFile /etc/mongo/keyfile --shardsvr --replSet site3rs --bind_ip 0.0.0.0 --port 27017 --dbpath /data/db
    ports:
      - 40302:27017
    volumes:
      - site3_shard_2:/data/db
      - ./files:/etc/mongo
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" site3_shard_2:27017
      interval: 10s
      timeout: 10s
      retries: 2

      
  site3_shard_3:
    container_name: site3_shard_3
    image: mongo
    env_file: .env
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /etc/mongo/keyfile
        chown 999:999 /etc/mongo/keyfile
        exec docker-entrypoint.sh $$@
    command: mongod --keyFile /etc/mongo/keyfile --shardsvr --replSet site3rs --bind_ip 0.0.0.0 --port 27017 --dbpath /data/db
    ports:
      - 40303:27017
    volumes:
      - site3_shard_3:/data/db
      - ./files:/etc/mongo
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" site3_shard_3:27017
      interval: 10s
      timeout: 10s
      retries: 2

  site1_shard_4:
    container_name: site1_shard_4
    image: mongo
    env_file: .env
    entrypoint:
      - bash
      - -c
      - |
        chmod 400 /etc/mongo/keyfile
        chown 999:999 /etc/mongo/keyfile
        exec docker-entrypoint.sh $$@
    command: mongod --keyFile /etc/mongo/keyfile  --shardsvr --replSet site1rs --bind_ip 0.0.0.0 --port 27017 --dbpath /data/db
    ports:
      - 40104:27017
    volumes:
      - site1_shard_4:/data/db
      - ./files:/etc/mongo
    networks:
      - ibdm-mongo-cluster
    healthcheck:
      test: mongosh -u ${SITE1_LOCAL_ADMIN_USER} -p ${SITE1_LOCAL_ADMIN_PASS} --eval "rs.status()" site1_shard_4:27017
      interval: 10s
      timeout: 10s
      retries: 2

volumes:
  site3_shard_1: {}
  site3_shard_2: {}
  site3_shard_3: {}
  site1_shard_4: {}

networks:
  ibdm-mongo-cluster:
    driver: bridge
    name: ibdm-mongo-cluster