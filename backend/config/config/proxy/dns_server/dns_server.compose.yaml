services:
  dns_server_bind9:
    container_name: dns_server_bind9
    image: ubuntu/bind9:latest
    environment:
      - BIND9_USER=root
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./config:/etc/bind
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind
    restart: always
