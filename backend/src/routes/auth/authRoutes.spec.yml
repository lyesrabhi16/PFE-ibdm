# tags
tags:
  - name: Auth
    description: Auth routes
    
# Components
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: '1'
        email:
          type: string
          example: 'example@example.com'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: 'email@example.com'
        password:
          type: string
          example: 'password'
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Login successful'
        user:
          $ref: '#/components/schemas/User'
        sid:
          type: string
          example: 'DZ2DZk645..'
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Logout successful'
    Error:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'

# APIs
/api/auth/login:
  post:
    summary: Login
    description: Login
    operationId: login
    tags:
      - Auth
    requestBody:
      content:
        application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
      required: true
    responses:
      '200':
        description: OK
        headers:
          Set-Cookie:
            description: Set sid cookie
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/auth/logout:
  post:
    summary: Logout
    description: Logout
    operationId: logout
    tags:
      - Auth
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/auth/dashboard:
  get:
    summary: Dashboard
    description: Dashboard
    operationId: dashboard
    tags:
      - Auth
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'


/api/auth/user/me:
  get:
    summary: Get user
    description: Get user
    operationId: getUser
    tags:
      - Auth
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '#/components/scomponents/schemas/Error'