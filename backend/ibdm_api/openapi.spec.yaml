          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
    PatchedPermissionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedRoleRequest:
      type: object
      properties:
        group:
          type: string
          format: uri
        permissions:
          type: array
          items:
            type: string
            format: uri
    PatchedUserRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        username:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone_number:
          type: string
          maxLength: 15
        avatar_url:
          type: string
          format: binary
