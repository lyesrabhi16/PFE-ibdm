components:
  schemas:
    Group:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          maxLength: 150
      required:
      - name
      - url
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
    PaginatedGroupList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    PaginatedPermissionList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PaginatedRoleList:
      type: object
