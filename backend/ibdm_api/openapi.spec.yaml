  /api/v1/user-management/users/:
    get:
      operationId: getUsers
      description: API endpoint that allows users to be viewed or edited.
      parameters:
      - name: enable_pagination
        in: query
        description: Enable or disable pagination
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of results per page
        required: false
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: addUser
      description: API endpoint that allows users to be viewed or edited.
      tags:
      - users
      requestBody:
