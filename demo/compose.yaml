# Self-contained demo: SQL Server + Redis + the Django/Daphne API (HTTPS on 8443)
#   docker compose -f demo/compose.yaml up --build
name: ibdm-demo
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: Demo_Passw0rd!
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
  api:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    env_file: demo.env
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8443:8443"
