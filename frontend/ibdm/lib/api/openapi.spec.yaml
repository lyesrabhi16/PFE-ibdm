components:
  schemas:
    Group:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
      required:
        - id
        - name
        - url
    PaginatedGroupList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    PaginatedPermissionList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PaginatedRoleList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PaginatedUserList:
      type: object
      properties:
        next_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=2
        previous_url:
          type: string
          nullable: true
          format: uri
          example: http://example.com/api/v1/users/?page=1
        total_pages:
          type: integer
          example: 10
        total_results:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 10
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedGroup:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
    PatchedPermission:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        permission_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        codename:
          type: string
          maxLength: 100
        content_type:
          type: integer
          writeOnly: true
        content_type_name:
          type: string
          readOnly: true
    PatchedRole:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        role_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        group_id:
          type: integer
        group:
          allOf:
            - $ref: '#/components/schemas/Group'
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          readOnly: true
